services:
  writing-assistant:
    build: .
    container_name: writing-assistant
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8010"
    volumes:
      - ./data:/app/data

  caddy:
    image: caddy:2.10-alpine
    container_name: writing-assistant-caddy
    restart: unless-stopped
    depends_on:
      - writing-assistant
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - writing_assistant_proxy

volumes:
  caddy_data:
  caddy_config:

networks:
  writing_assistant_proxy:
    name: writing-assistant-proxy
